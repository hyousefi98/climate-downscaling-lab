name: Code and scientific invariants

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install code and CPU test dependencies
        run: python -m pip install -e '.[test,baselines,plots]'
      - name: Check source-only repository
        run: python scripts/check_repository.py
      - name: Run CPU scientific and workflow checks
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          WANDB_MODE: disabled
        run: python -m pytest -m 'not integration and not gpu'
