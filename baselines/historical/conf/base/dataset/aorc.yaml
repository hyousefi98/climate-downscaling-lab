# Dataset type - AORC downscaling dataset
type: aorc_legacy

# Path to input zarr (12km upsampled to 3km). Must be overridden.
input_data_path: ???

# Path to target zarr (3km native). Must be overridden.
target_data_path: ???

# Path to JSON stats file with normalization parameters. Must be overridden.
stats_path: ???

# Training mode (True for training, False for validation)
train: True

# Training year range (inclusive) - first 12 years
train_years: [2000, 2011]

# Validation year range (inclusive) - last year
valid_years: [2012, 2012]

# DEPRECATED: Apply 0.1 factor to precipitation only (use apply_scale_factors instead)
apply_precip_factor: True

# Apply AORC scale factors to ALL variables (stored → physical units)
# Scale factors: TMP=0.1, PRES=0.1, SPFH=0.001, APCP=0.1, UGRD=0.1, VGRD=0.1, DLWRF=0.1, DSWRF=0.1
apply_scale_factors: True

# Clip negative values to zero for precipitation-like variables
clip_negative: True

# Input variables (all variables from aorc_12km_2_3km). Set to null to use all.
# input_variables:
#   - "APCP_surface"
#   - "DLWRF_surface"
#   - "DSWRF_surface"
#   - "PRES_surface"
#   - "SPFH_2maboveground"
#   - "TMP_2maboveground"
#   - "UGRD_10maboveground"
#   - "VGRD_10maboveground"

# # Output variables (all variables from aorc_3km). Set to null to use all.
# output_variables:
#   - "APCP_surface"
#   - "DLWRF_surface"
#   - "DSWRF_surface"
#   - "PRES_surface"
#   - "SPFH_2maboveground"
#   - "TMP_2maboveground"
#   - "UGRD_10maboveground"
#   - "VGRD_10maboveground"
