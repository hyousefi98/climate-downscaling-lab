# Minimal AORC config for RF training/validation

dataset:
  type: aorc_legacy

  landmask_path: data/grids/aorc_land_mask_3km.nc
  mask_ocean_in_target: true
  keep_ocean_as_nan: true
  sanitize_inputs: true
  coastal_buffer_pixels: 5

  debug_nan: true
  debug_nan_limit: 20
  drop_nan_land_timesteps: true
  scan_workers: 8
  nan_chunk: 128
  nan_check_vars: null

  # Path to input zarr file (12km upsampled to 3km grid)
  input_data_path: data/processed/aorc_12km_2_3km_2000_2012_6h.zarr
  # Path to target zarr file (native 3km resolution)
  target_data_path: data/processed/aorc_3km_2000_2012_6h.zarr
  # Path to statistics JSON file (generated by compute_stats.py)
  stats_path: data/processed/aorc_stats_buffered.json

  train: true
  train_years: [2000, 2011]
  valid_years: [2012, 2012]

  apply_scale_factors: true
  clip_negative: true

  input_variables:
    - "APCP_surface"
    - "DLWRF_surface"
    - "DSWRF_surface"
    - "PRES_surface"
    - "SPFH_2maboveground"
    - "TMP_2maboveground"
    - "UGRD_10maboveground"
    - "VGRD_10maboveground"
  output_variables:
    - "APCP_surface"
    - "DLWRF_surface"
    - "DSWRF_surface"
    - "PRES_surface"
    - "SPFH_2maboveground"
    - "TMP_2maboveground"
    - "UGRD_10maboveground"
    - "VGRD_10maboveground"

validation:
  train: false
