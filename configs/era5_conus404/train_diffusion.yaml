# Composed from archived NVIDIA-derived experiment configuration.
# Historical configuration snapshot; not a guarantee of exact checkpoint lineage.
dataset:
  type: era5_conus404
  input_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/era5_4km_2000_2012_6h.zarr
  target_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/conus404_4km_2000_2012_6h.zarr
  stats_path: ${oc.env:DG_DATA_ROOT,./data_local}/era5_conus404_4km_stats.json
  train: true
  train_years:
  - 2000
  - 2011
  valid_years:
  - 2012
  - 2012
  apply_scale_factors: true
  input_scale_factors: {}
  output_scale_factors:
    PSFC: 0.01
  clip_negative: true
  precip_threshold: 0.1
  input_variables:
  - PREC_ACC_NC
  - GLW
  - SWDOWN
  - PSFC
  - T2
  - U10
  - V10
  - q_925
  - q_850
  - q_700
  - q_500
  - r_925
  - r_850
  - r_700
  - r_500
  - t_925
  - t_850
  - t_700
  - t_500
  - u_925
  - u_850
  - u_700
  - u_500
  - v_925
  - v_850
  - v_700
  - v_500
  - z_925
  - z_850
  - z_700
  - z_500
  - cc_925
  - cc_850
  - cc_700
  - cc_500
  output_variables:
  - PREC_ACC_NC
  - GLW
  - SWDOWN
  - PSFC
  - Q2
  - T2
  - U10
  - V10
  landmask_path: null
  mask_ocean_in_target: false
  sanitize_inputs: true
  keep_ocean_as_nan: false
  drop_nan_land_timesteps: false
  nan_check_vars: null
  nan_chunk: 128
  debug_nan: false
  debug_nan_limit: 10
  coastal_buffer_pixels: 0
  crop_to_multiple: 32
model:
  name: diffusion
  hr_mean_conditioning: true
  model_args:
    gridtype: sinusoidal
    N_grid_channels: 4
    embedding_type: zero
    model_channels: 128
    channel_mult:
    - 1
    - 2
    - 2
    - 2
    - 2
    attn_resolutions:
    - 28
training:
  hp:
    training_duration: 5000000
    total_batch_size: 32
    batch_size_per_gpu: 8
    lr: 0.0002
    grad_clip_threshold: null
    lr_decay: 1
    lr_rampup: 50000
    lr_decay_rate: 500000
  perf:
    fp_optimizations: amp-bf16
    dataloader_workers: 2
    songunet_checkpoint_level: 0
  io:
    regression_checkpoint_path: ${oc.env:DG_CHECKPOINT_ROOT,./checkpoints}/era5_conus404/UNet.0.150016.mdlus
    print_progress_freq: 1000
    save_checkpoint_freq: 5000
    save_n_recent_checkpoints: -1
    validation_freq: 5000
    validation_steps: 10
    checkpoint_dir: .
validation:
  train: false
wandb:
  mode: disabled
  results_dir: ./wandb
  watch_model: false
