# Composed from archived NVIDIA-derived experiment configuration.
# Historical configuration snapshot; not a guarantee of exact checkpoint lineage.
dataset:
  type: wrf
  input_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_12km_on_aorc_3km_2000_2012.zarr
  target_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_3km_on_aorc_3km_2000_2012.zarr
  stats_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_stats_3km.json
  train: true
  train_years:
  - 2000
  - 2011
  valid_years:
  - 2012
  - 2012
  clip_negative: true
  precip_threshold: 0.1
  landmask_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_land_mask_3km.nc
  mask_ocean_in_target: true
  keep_ocean_as_nan: false
  sanitize_inputs: true
  coastal_buffer_pixels: 0
  debug_nan: true
  debug_nan_limit: 20
  drop_nan_land_timesteps: true
  nan_chunk: 128
  nan_check_vars: null
  apply_scale_factors: true
  input_variables:
  - RAIN_TOTAL
  - GLW
  - SWDOWN
  - PSFC
  - Q2
  - T2
  - U10
  - V10
  output_variables:
  - RAIN_TOTAL
  - GLW
  - SWDOWN
  - PSFC
  - Q2
  - T2
  - U10
  - V10
model:
  name: regression
  hr_mean_conditioning: false
  model_args:
    N_grid_channels: 4
    embedding_type: zero
    model_channels: 128
    channel_mult:
    - 1
    - 2
    - 2
    - 2
    - 2
    attn_resolutions:
    - 28
training:
  hp:
    training_duration: 2000000
    total_batch_size: 64
    batch_size_per_gpu: 16
    lr: 0.0002
    grad_clip_threshold: 1.0
    lr_decay: 0.999
    lr_rampup: 10000
    lr_decay_rate: 100000
    dry_precip_penalty: 2.0
    dry_precip_threshold: 0.1
  perf:
    fp_optimizations: amp-bf16
    dataloader_workers: 2
    songunet_checkpoint_level: 6
    use_apex_gn: false
  io:
    regression_checkpoint_path: null
    print_progress_freq: 1000
    save_checkpoint_freq: 5000
    save_n_recent_checkpoints: -1
    validation_freq: 10000
    validation_steps: 20
    checkpoint_dir: .
validation:
  train: false
wandb:
  mode: disabled
  results_dir: ./wandb
  watch_model: false
