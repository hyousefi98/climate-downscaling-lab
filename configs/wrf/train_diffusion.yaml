# Composed from archived NVIDIA-derived experiment configuration.
# Historical configuration snapshot; not a guarantee of exact checkpoint lineage.
dataset:
  type: wrf
  input_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_12km_on_aorc_3km_2000_2012.zarr
  target_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_3km_on_aorc_3km_2000_2012.zarr
  stats_path: ${oc.env:DG_DATA_ROOT,./data_local}/wrf_stats_3km.json
  train: true
  train_years:
  - 2000
  - 2011
  valid_years:
  - 2012
  - 2012
  clip_negative: true
  precip_threshold: 0.1
  landmask_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_land_mask_3km.nc
  mask_ocean_in_target: true
  keep_ocean_as_nan: false
  input_variables:
  - RAIN_TOTAL
  - GLW
  - SWDOWN
  - PSFC
  - Q2
  - T2
  - U10
  - V10
  output_variables:
  - RAIN_TOTAL
  - GLW
  - SWDOWN
  - PSFC
  - Q2
  - T2
  - U10
  - V10
model:
  name: diffusion
  hr_mean_conditioning: true
  model_args:
    gridtype: sinusoidal
    N_grid_channels: 4
    embedding_type: zero
    model_channels: 128
    channel_mult:
    - 1
    - 2
    - 2
    - 2
    - 2
    attn_resolutions:
    - 28
training:
  hp:
    training_duration: 5000000
    total_batch_size: 16
    batch_size_per_gpu: 8
    lr: 0.0002
    grad_clip_threshold: null
    lr_decay: 1
    lr_rampup: 50000
    lr_decay_rate: 500000
  perf:
    fp_optimizations: amp-bf16
    dataloader_workers: 2
    songunet_checkpoint_level: 0
  io:
    regression_checkpoint_path: ${oc.env:DG_CHECKPOINT_ROOT,./checkpoints}/wrf/UNet.0.155008.mdlus
    print_progress_freq: 1000
    save_checkpoint_freq: 5000
    save_n_recent_checkpoints: -1
    validation_freq: 5000
    validation_steps: 10
    checkpoint_dir: .
validation:
  train: false
wandb:
  mode: disabled
  results_dir: ./wandb
  watch_model: false
