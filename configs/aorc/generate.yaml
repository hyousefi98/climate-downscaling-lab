# Settings recovered from the saved paper-output configuration, not current mutable YAML.
dataset:
  type: aorc
  input_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_12km_2_3km_2000_2012_6h.zarr
  target_data_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_3km_2000_2012_6h.zarr
  stats_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_stats_3km.json
  train: false
  train_years:
  - 2000
  - 2011
  valid_years:
  - 2012
  - 2012
  apply_precip_factor: true
  apply_scale_factors: true
  clip_negative: true
  precip_threshold: 0.1
  landmask_path: ${oc.env:DG_DATA_ROOT,./data_local}/aorc_land_mask_3km.nc
  mask_ocean_in_target: true
  keep_ocean_as_nan: true
  sanitize_inputs: true
  coastal_buffer_pixels: 10
  debug_nan: true
  debug_nan_limit: 20
  drop_nan_land_timesteps: true
  nan_chunk: 128
  nan_check_vars: null
  input_variables:
  - APCP_surface
  - DLWRF_surface
  - DSWRF_surface
  - PRES_surface
  - SPFH_2maboveground
  - TMP_2maboveground
  - UGRD_10maboveground
  - VGRD_10maboveground
  output_variables:
  - APCP_surface
  - DLWRF_surface
  - DSWRF_surface
  - PRES_surface
  - SPFH_2maboveground
  - TMP_2maboveground
  - UGRD_10maboveground
  - VGRD_10maboveground
sampler:
  type: stochastic
  num_steps: 18
generation:
  num_ensembles: 4
  seed_batch_size: 1
  inference_mode: all
  hr_mean_conditioning: true
  times_range: null
  has_lead_time: false
  perf:
    force_fp16: false
    use_torch_compile: false
    num_writer_workers: 1
  patching: false
  residual_std_path: ${oc.env:DG_ARTIFACT_ROOT,./artifacts}/residual_std_aorc.json
  residual_scale: 1.0
  residual_clip: null
  ratio_eps: 0.001
  times:
  - '2012-01-13T06:00:00'
  random_samples: 200
  io:
    reg_ckpt_filename: ${oc.env:DG_CHECKPOINT_ROOT,./checkpoints}/aorc/UNet.0.200000.mdlus
    res_ckpt_filename: ${oc.env:DG_CHECKPOINT_ROOT,./checkpoints}/aorc/EDMPrecondSuperResolution.0.400000.mdlus
    output_filename: predictions.nc
    ema_ckpt_filename: null
wandb:
  mode: disabled
  results_dir: ./wandb
